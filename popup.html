<!DOCTYPE html>
<html>

<head>
    <style>
        body {
            width: 300px;
            height: 200px;
            background-color: #000;
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-family: sans-serif;
            margin: 0;
        }

        h1 {
            font-size: 24px;
            margin-bottom: 20px;
        }

        button {
            background-color: white;
            color: black;
            border: none;
            padding: 10px 30px;
            border-radius: 20px;
            font-weight: bold;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover {
            background-color: #ddd;
        }

        .footer {
            margin-top: 30px;
            font-size: 12px;
            color: #888;
        }

        .footer a {
            color: #00aeef;
            text-decoration: none;
        }
    </style>
</head>

<body>
    <h1>ZenMode GP</h1>
    <p style="text-align: center; font-size: 14px; margin-bottom: 15px;">
        Click the button to activate ZenMode GP<br>
        <b>F5</b> to refresh the page<br>
        <b>F11</b> to go fullscreen
    </p>

    <button id="activateBtn">Activate</button>
    <div class="footer">made by <a href="https://github.com/ostenjap" target="_blank">ostenjap</a></div>

    <script src="popup.js"></script>
</body>

</html>
